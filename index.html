<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; }
        html, body, canvas { width: 100%; height: 100%; display: block; }
        #debug {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            max-height: 30%;
            overflow-y: auto;
            background: rgba(0,0,0,0.8);
            color: lime;
            font-family: monospace;
            font-size: 12px;
            padding: 5px;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="debug"></div>
    <script>
        (function() {
            const dbg = document.getElementById('debug');
            const orig = console.log;
            console.log = function(...args) {
                orig.apply(console, args);
                dbg.innerHTML += args.join(' ') + '<br>';
                dbg.scrollTop = dbg.scrollHeight;
            };
        })();
    </script>
    <script>var Module = { canvas: document.getElementById('canvas') };</script>
    <script src="main.js"></script>
</body>
</html>
